[package]
name = "cuprite_wire_macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Procedural macros generating cuprite_wire parts from KiCad libraries"

[lib]
proc-macro = true
# Examples of the macro need cuprite_wire, which depends on this crate; they are tested there.
doctest = false

[dependencies]
cuprite_wire_kicad_lib = { path = "../kicad_lib" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
