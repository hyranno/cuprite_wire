[package]
name = "cuprite_wire_macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros generating cuprite_wire parts from KiCad libraries"
keywords = ["kicad", "spice", "circuit-design", "proc-macro"]
categories = ["simulation", "science"]

[lib]
proc-macro = true
# Examples of the macro need cuprite_wire, which depends on this crate; they are tested there.
doctest = false

[dependencies]
cuprite_wire_kicad_lib.workspace = true
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }
