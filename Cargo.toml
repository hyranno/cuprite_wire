[workspace]
members = ["crates/embedded_hal", "crates/ibis", "crates/kicad_lib", "crates/macros", "xtask"]

[workspace.package]
# The crates are released together, with the same version (see .github/workflows/release.yml).
version = "0.3.0"
edition = "2024"
# The lowest version CI checks (the msrv job); uuid needs 1.89.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/hyranno/cuprite_wire"

[workspace.dependencies]
# Keep the versions equal to workspace.package.version.
cuprite_wire = { version = "0.3.0", path = "." }
cuprite_wire_ibis = { version = "0.3.0", path = "crates/ibis" }
cuprite_wire_kicad_lib = { version = "0.3.0", path = "crates/kicad_lib" }
cuprite_wire_macros = { version = "0.3.0", path = "crates/macros" }

[package]
name = "cuprite_wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Describe electronic circuits in Rust, test them with ERC and SPICE simulations, and hand them to the KiCad PCB editor (pcbnew) as a netlist"
readme = "README.md"
keywords = ["kicad", "spice", "circuit-design", "netlist", "eda"]
categories = ["simulation", "science"]
# Development environment, repository tooling, tests and examples; not needed to build or use the
# crate. The tests and examples need files outside the package and are read in the repository.
exclude = [
    ".cargo/",
    ".claude/",
    ".devcontainer/",
    ".githooks/",
    ".github/",
    ".gitattributes",
    ".gitignore",
    "deny.toml",
    "examples/",
    "tests/",
    "tools/",
]

[package.metadata.docs.rs]
features = ["ibis", "shared-ngspice"]
# Marks the items needing a feature in the documentation (`doc_cfg` in src/lib.rs).
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-shear]
# Compile-fail cases for trybuild (tests/kicad_part_errors.rs), not modules.
ignored-paths = ["tests/ui/*.rs", "tests/ui/ibis/*.rs"]

[dependencies]
cuprite_wire_ibis = { workspace = true, optional = true }
cuprite_wire_kicad_lib.workspace = true
cuprite_wire_macros.workspace = true
dyn-clone = "1.0.20"
libloading = { version = "0.9.1", optional = true }
log = "0.4.35"
petgraph = "0.8.3"
uuid = { version = "1.29.2", features = ["v5"] }

[dev-dependencies]
itertools = "0.15.0"
trybuild = "1.0.125"

[features]
# Tests generating parts from the KiCad (9 or 10) libraries in /usr/share/kicad (the devcontainer has them).
kicad-libraries = []

# Tests with vendor models downloaded into $CUPRITE_VENDOR_MODELS_DIR (they cannot be committed).
vendor-models = []

# Runs decks in the ngspice shared library (libngspice), loaded at run time: the backend of
# co-simulation with Rust models.
shared-ngspice = ["dep:libloading"]

# Simulation parts of IBIS models (spice::ibis), read with cuprite_wire_ibis.
ibis = ["dep:cuprite_wire_ibis"]

[[test]]
name = "kicad_libraries"
required-features = ["kicad-libraries"]

[[test]]
name = "vendor_models"
required-features = ["vendor-models"]

[[test]]
name = "vendor_ibis"
required-features = ["vendor-models", "ibis"]

[[test]]
name = "ibis_part"
required-features = ["ibis"]

[[test]]
name = "ibis_part_errors"
required-features = ["ibis"]

[[test]]
name = "kicad_part_ibis"
required-features = ["ibis"]

# Runs the tests of the example's subcircuits with `cargo test` (they need ngspice, like the
# simulation tests of the library).
[[example]]
name = "sensor_frontend"
test = true

# Co-simulation with a Rust model of a microcontroller; needs the ngspice shared library.
[[example]]
name = "pwm_dac_feedback"
required-features = ["shared-ngspice"]
test = true

# Signal integrity with the IBIS models of the I/O buffers; runs ngspice.
[[example]]
name = "ibis_signal_integrity"
required-features = ["ibis"]
test = true
