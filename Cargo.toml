[workspace]
members = ["crates/kicad_lib", "crates/macros"]

[workspace.package]
edition = "2024"
license = "MIT"

[package]
name = "cuprite_wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cuprite_wire_macros = { path = "crates/macros" }
dyn-clone = "1.0.20"
itertools = "0.15.0"
petgraph = "0.8.3"
uuid = { version = "1.29.2", features = ["v5"] }

[dev-dependencies]
trybuild = "1.0.125"

[features]
# Tests generating parts from the KiCad 9 libraries in /usr/share/kicad (the devcontainer has them).
kicad-libraries = []

# Tests with vendor models downloaded into $CUPRITE_VENDOR_MODELS_DIR (they cannot be committed).
vendor-models = []

[[test]]
name = "kicad_libraries"
required-features = ["kicad-libraries"]

[[test]]
name = "vendor_models"
required-features = ["vendor-models"]

# Runs the tests of the example's subcircuits with `cargo test` (they need ngspice, like the
# simulation tests of the library).
[[example]]
name = "sensor_frontend"
test = true
