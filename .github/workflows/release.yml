name: Release

# Pushing a tag `vX.Y.Z` publishes the crates of the workspace to crates.io and then creates the
# GitHub release, so a release exists only for versions that were published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    container: rust:trixie
    environment: crates-io
    permissions:
      contents: read
      # Trusted publishing: crates.io exchanges the OIDC token for a short-lived token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the version
        run: |
          pkgid="$(cargo pkgid -p cuprite_wire)"
          version="${pkgid##*[#@]}"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version ${version} in Cargo.toml"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Publishes the crates in dependency order.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
