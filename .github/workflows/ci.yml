name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    # The same base image as the devcontainer.
    container: rust:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features shared-ngspice -- -D warnings
      # cuprite_wire_embedded_hal turns shared-ngspice on for the whole workspace build;
      # check cuprite_wire without it too.
      - run: cargo clippy -p cuprite_wire --all-targets -- -D warnings
      # Broken intra-doc links and other rustdoc warnings.
      - run: cargo doc --workspace --no-deps --features shared-ngspice
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    # Debian trixie provides ngspice 44 and the KiCad 9 libraries, as in the devcontainer.
    container: rust:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libngspice0 is the shared library of the shared-ngspice feature; ngspice does not depend on it.
      # Verilator builds the Verilog designs of the XSPICE tests.
      - name: Install ngspice, Verilator and the KiCad libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ngspice libngspice0 verilator kicad-symbols kicad-footprints
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --features kicad-libraries,shared-ngspice
      - name: Tests reading the KiCad libraries
        run: cargo test -p cuprite_wire_kicad_lib -- --ignored
