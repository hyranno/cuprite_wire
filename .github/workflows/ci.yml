name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The checks are tasks of xtask (xtask/src/main.rs, `cargo xtask help`), which the git hooks run
# locally too.
jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    # The same base image as the KiCad 9 test environment.
    container: rust:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same version as the devcontainer. After the cache, which could restore another version.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      - run: cargo xtask fmt
      # Clippy with and without the optional features, and rustdoc warnings.
      - run: cargo xtask lint
      # The licenses and sources of the dependencies (deny.toml); audit.yml checks the advisories.
      - run: cargo xtask deny

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    container: rust:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version is workspace.package.rust-version in Cargo.toml.
      - name: Install the minimum supported toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          rustup toolchain install "${msrv}" --profile minimal
          echo "MSRV=${msrv}" >> "${GITHUB_ENV}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo "+${MSRV}" xtask check

  test:
    name: test (KiCad ${{ matrix.kicad }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian trixie provides ngspice 44 and the KiCad 9 libraries.
          - kicad: 9
            image: rust:trixie
            packages: kicad-symbols kicad-footprints
            # The KiCad demos are in the kicad/kicad image, not in the packages of Debian trixie.
            test-options: --no-kicad-demos
          # The base image of the devcontainer, with the KiCad 10 libraries; Rust is installed below.
          - kicad: 10
            image: kicad/kicad:10.0
            packages: build-essential ca-certificates curl
            test-options: ""
    container:
      image: ${{ matrix.image }}
      # kicad/kicad runs as the user `kicad` by default.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libngspice0 is the shared library of the shared-ngspice feature; ngspice does not depend on it.
      # Verilator builds the Verilog designs of the XSPICE tests.
      - name: Install ngspice, Verilator and the KiCad libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ngspice libngspice0 verilator ${{ matrix.packages }}
      - name: Install Rust
        if: matrix.kicad == 10
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kicad${{ matrix.kicad }}
      # Including the ignored tests reading the KiCad libraries and demos.
      - run: cargo xtask test ${{ matrix.test-options }}

  test-other-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Homebrew's libngspice is in a directory the dynamic loader does not search by default.
      # The libngspice formula removes its spinit, so the library loads no XSPICE code models;
      # the spinit of the ngspice formula loads those of libngspice.
      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ngspice
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:/usr/lib" >> "${GITHUB_ENV}"
          echo "SPICE_LIB_DIR=$(brew --prefix ngspice)/share/ngspice" >> "${GITHUB_ENV}"
      # MSYS2 is on the runner. Its shared library is copied to ngspice.dll, the name of the
      # official build and the default of SharedNgspice.
      - name: Install ngspice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-ngspice
          Copy-Item C:\msys64\ucrt64\bin\libngspice-0.dll C:\msys64\ucrt64\bin\ngspice.dll
          "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH
          # ngspice looks for spinit (which loads the XSPICE code models) in its build prefix
          # otherwise, which MSYS2 does not have. spinit names the code models by MSYS2 paths
          # (/ucrt64/lib/ngspice/...), which the native ngspice cannot open.
          "SPICE_LIB_DIR=C:\msys64\ucrt64\share\ngspice" >> $env:GITHUB_ENV
          $spinit = 'C:\msys64\ucrt64\share\ngspice\scripts\spinit'
          (Get-Content $spinit) -replace '/ucrt64/', 'C:/msys64/ucrt64/' | Set-Content $spinit
          Select-String -Path $spinit -Pattern 'codemodel'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Without the KiCad libraries; the XSPICE tests building code models are Linux-only.
      - run: cargo xtask test --no-kicad
